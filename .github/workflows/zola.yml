name: Build and deploy
on:
  push:
    branches:
      - main
      - zola
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.23.6
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Zola
        run: |
          mkdir -p "${HOME}/.local/zola"
          curl -sLJO "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -C "${HOME}/.local/zola" -xf "zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          rm "zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HOME}/.local/zola" >> "${GITHUB_PATH}"
      - name: Verify Zola
        run: zola --version
      - name: Check site
        run: zola check --skip-external-links
      - name: Build stage site
        run: |
          zola build \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --output-dir ./public-stage
      - name: Upload stage artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public-stage
      - name: Build prod site
        if: github.ref == 'refs/heads/main'
        run: |
          zola build \
            --base-url "https://frosty-geek.net" \
            --output-dir ./public-prod
      - name: Upload prod artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: prod-site
          path: ./public-prod
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  deploy-eos:
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://frosty-geek.net/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download prod artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-site
          path: ./public-prod
      - name: Verify prod artifact
        run: |
          test -f ./public-prod/index.html
          test -f ./public-prod/.htaccess
      - name: Deploy to eos
        env:
          EOS_SSH_KEY: ${{ secrets.EOS_SSH_KEY }}
        run: |
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${EOS_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s\n' 'eos.f-g.xyz ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII8Ugna75Y5TseZakQha8gjztO/wxZpfAAjz9TOX/9R0' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          rsync -rlptvz --delete-delay \
            -e "ssh -i ${HOME}/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
            ./public-prod/ ralf@eos.f-g.xyz:.
          rm -f "${HOME}/.ssh/deploy_key"

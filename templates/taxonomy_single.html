{% extends "base.html" %}

{% block content %}
<main class="posts">
  <h1>#{{ term.name }}</h1>
  <ul class="posts-list">
    {%- for page in term.pages %}
    <li class="post-item">
      <a href="{{ page.permalink }}" class="post-item-inner">
        <span class="post-title">{{ page.title }}</span>
        <span class="post-day">{{ page.date | date(format="%b %e, %Y") }}</span>
      </a>
    </li>
    {%- endfor %}
  </ul>
</main>
{% endblock content %}
